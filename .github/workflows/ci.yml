name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payledger
          POSTGRES_PASSWORD: payledger
          POSTGRES_DB: payledger_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U payledger -d payledger_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://payledger:payledger@localhost:5433/payledger_test
      DATABASE_URL_TEST: postgresql://payledger:payledger@localhost:5433/payledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
