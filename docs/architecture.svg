<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b8cff"/></marker></defs><rect width="1200" height="620" fill="#0b0e14"/><rect x="20" y="120" width="170" height="80" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="105.0" y="156.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">Client</text><text x="105.0" y="177.0" text-anchor="middle" font-size="12" fill="#8b93a7">POST /v1/transfers</text><rect x="240" y="110" width="210" height="100" rx="12" fill="#121722" stroke="#5b8cff" stroke-width="2"/><text x="345.0" y="156.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">Express API</text><text x="345.0" y="177.0" text-anchor="middle" font-size="12" fill="#8b93a7">API key · Zod</text><text x="345" y="196" text-anchor="middle" font-size="11" fill="#5d6579">Idempotency-Key checked first</text><line x1="190" y1="160" x2="238" y2="160" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="30" width="430" height="400" rx="16" fill="none" stroke="#5b8cff" stroke-dasharray="6 6" stroke-width="1.5"/><text x="520" y="56" font-size="13" font-weight="600" fill="#8fa2ff">One PostgreSQL transaction</text><rect x="530" y="72" width="370" height="62" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="99.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">1. Lock accounts</text><text x="715.0" y="120.0" text-anchor="middle" font-size="12" fill="#8b93a7">SELECT … ORDER BY id FOR UPDATE</text><rect x="530" y="146" width="370" height="62" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="173.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">2. Journal entry + postings</text><text x="715.0" y="194.0" text-anchor="middle" font-size="12" fill="#8b93a7">legs sum to zero (deferred trigger)</text><rect x="530" y="220" width="370" height="62" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="247.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">3. Update balances</text><text x="715.0" y="268.0" text-anchor="middle" font-size="12" fill="#8b93a7">CHECK balance ≥ 0 for customers</text><rect x="530" y="294" width="370" height="62" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="321.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">4. Outbox event + deliveries</text><text x="715.0" y="342.0" text-anchor="middle" font-size="12" fill="#8b93a7">same commit as the payment</text><rect x="530" y="368" width="370" height="50" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="389.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">5. Store idempotent response</text><text x="715.0" y="410.0" text-anchor="middle" font-size="12" fill="#8b93a7">retries replay it</text><line x1="450" y1="160" x2="528" y2="103" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/><rect x="990" y="280" width="190" height="90" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="1085.0" y="321.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">Dispatcher</text><text x="1085.0" y="342.0" text-anchor="middle" font-size="12" fill="#8b93a7">SKIP LOCKED · backoff</text><line x1="902" y1="325" x2="988" y2="325" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/><text x="960" y="315" text-anchor="middle" font-size="12" fill="#8b93a7">claim</text><rect x="990" y="450" width="190" height="90" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="1085.0" y="491.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">Merchant endpoint</text><text x="1085.0" y="512.0" text-anchor="middle" font-size="12" fill="#8b93a7">verifies HMAC</text><line x1="1085" y1="372" x2="1085" y2="448" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/><text x="1095" y="415" text-anchor="start" font-size="12" fill="#8b93a7">signed POST</text><rect x="530" y="470" width="370" height="80" rx="12" fill="#121722" stroke="#2a3346" stroke-width="1.5"/><text x="715.0" y="506.0" text-anchor="middle" font-size="16" font-weight="700" fill="#e6e9f0">Reconciliation</text><text x="715.0" y="527.0" text-anchor="middle" font-size="12" fill="#8b93a7">Σ postings = stored balance; trial balance = 0</text><line x1="715" y1="432" x2="715" y2="468" stroke="#5b8cff" stroke-width="2" marker-end="url(#a)"/><text x="20" y="600" font-size="13" fill="#5d6579">If any step fails, nothing is written: no money moves, no webhook is queued, and the key is free or holds the stored error.</text></svg>