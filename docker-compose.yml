services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
      POSTGRES_DB: payledger
    ports:
      - "5433:5432"
    volumes:
      - payledger_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  payledger_data:
